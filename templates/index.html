<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doctor Listing Extractor</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main><h1>Doctor Listing Extractor</h1><p class="subtitle">Paste one public Justdial listing URL. Results stay in this browser until you download them.</p><form id="form"><label>Listing URL<input id="url" name="url" type="url" placeholder="https://www.justdial.com/..." required></label><details><summary>Advanced: change page selectors if the layout is different</summary><div class="selectors"><label>Listing card<input id="card" name="card" placeholder=".resultbox"></label><label>Name<input id="name" name="name" placeholder="h2, h3"></label><label>Specialty<input id="specialty" name="specialty" placeholder=".category"></label><label>Address<input id="address" name="address" placeholder=".address"></label><label>City<input id="city" name="city" placeholder=".city"></label><label>Rating<input id="rating" name="rating" placeholder=".rating"></label><label>Reviews<input id="reviews" name="reviews" placeholder=".review"></label></div></details><button id="extract" type="submit">Extract public listings</button></form><p id="status" role="status"></p><button id="download" hidden>Download CSV</button><div class="table-wrap"><table id="table" hidden><thead><tr><th>Name</th><th>Specialty</th><th>Address</th><th>City</th><th>Rating</th><th>Reviews</th></tr></thead><tbody></tbody></table></div></main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
